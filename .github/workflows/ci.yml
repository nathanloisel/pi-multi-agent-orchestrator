name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly canary: keep validating the newest published pi ('latest').
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        pi-version: ['0.85.1', '0.87.0', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Overlay node_modules with the selected pi release (baseline lockfile is
      # intentionally kept at 0.85.1; the overlay leaves manifest/lock intact).
      - run: npm run pi:test-version -- ${{ matrix.pi-version }}
      - name: Print tested pi versions
        run: node -e "const p=JSON.parse(require('fs').readFileSync('node_modules/@earendil-works/pi-coding-agent/package.json','utf8'));console.log('tested pi:', p.name+'@'+p.version)"
      - run: npm run release:check
